{% extends "base.html" %}
{% block title %}تسجيل الدخول{% endblock %}
{% block body %}
<div class="container" style="max-width:420px">
  <div class="card">
    <h1>Supermarket ERP</h1>
    <p>تسجيل الدخول إلى لوحة الإدارة</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>اسم المستخدم</label>
      <input class="input" name="username" autocomplete="username" required autofocus>
      <label>كلمة المرور</label>
      <input class="input" type="password" name="password" autocomplete="current-password" required>
      <button class="btn" type="submit">دخول</button>
    </form>
  </div>
</div>
{% endblock %}
