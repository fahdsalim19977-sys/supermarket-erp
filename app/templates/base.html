<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NQ Supermarket ERP{% endblock %}</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#1f2937}.nav{background:#111827;color:#fff;padding:14px 24px;display:flex;justify-content:space-between}.container{max-width:1100px;margin:40px auto;padding:0 20px}.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 18px #00000012}.btn{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:#2563eb;color:#fff}.input{width:100%;box-sizing:border-box;padding:11px;margin:7px 0 15px;border:1px solid #d1d5db;border-radius:8px}.alert{padding:12px;border-radius:8px;margin-bottom:12px;background:#fee2e2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
