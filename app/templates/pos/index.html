{% extends "base.html" %}
{% block content %}
<div class="container-fluid py-3" dir="rtl">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>نقطة البيع POS</h2>
    <span class="badge bg-success">متصل</span>
  </div>
  <div class="row g-3">
    <div class="col-lg-7">
      <div class="card shadow-sm">
        <div class="card-body">
          <label class="form-label">باركود المنتج</label>
          <input id="barcode" class="form-control form-control-lg" autofocus autocomplete="off" placeholder="امسح الباركود ثم اضغط Enter">
          <div id="lookup-message" class="small mt-2"></div>
          <div class="mt-4 text-muted">امسح الباركود لإضافة المنتج إلى السلة.</div>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card shadow-sm">
        <div class="card-header">السلة</div>
        <div class="card-body">
          <div id="cart"></div>
          <hr>
          <div class="d-flex justify-content-between"><strong>الإجمالي</strong><strong id="total">0.00 EGP</strong></div>
          <button id="pay" class="btn btn-primary btn-lg w-100 mt-3" disabled>الدفع</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const cart=[];
const barcode=document.getElementById('barcode');
const cartEl=document.getElementById('cart');
const totalEl=document.getElementById('total');
const pay=document.getElementById('pay');
const msg=document.getElementById('lookup-message');
function render(){
  cartEl.innerHTML=cart.length?cart.map((x,i)=>`<div class="d-flex justify-content-between align-items-center border-bottom py-2"><span>${x.name} × ${x.quantity}</span><strong>${(x.price*x.quantity).toFixed(2)}</strong></div>`).join(''):'<div class="text-muted">السلة فارغة</div>';
  const total=cart.reduce((s,x)=>s+x.price*x.quantity,0);
  totalEl.textContent=total.toFixed(2)+' EGP'; pay.disabled=!cart.length;
}
barcode.addEventListener('keydown',async e=>{
 if(e.key!=='Enter') return; e.preventDefault(); const value=barcode.value.trim(); if(!value)return;
 msg.textContent='جاري البحث...';
 try{const r=await fetch(`/pos/api/lookup?barcode=${encodeURIComponent(value)}`); const j=await r.json();
  if(!r.ok) throw new Error('المنتج غير موجود');
  const p=j.data; const existing=cart.find(x=>x.id===p.id); if(existing) existing.quantity+=1; else cart.push({id:p.id,name:p.name,price:Number(p.price),quantity:1});
  render(); msg.className='small mt-2 text-success'; msg.textContent='تمت إضافة المنتج';
 }catch(err){msg.className='small mt-2 text-danger';msg.textContent=err.message;} finally{barcode.value=''; barcode.focus();}
});
render();
</script>
{% endblock %}
