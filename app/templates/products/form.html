{% extends "base.html" %}
{% block title %}إضافة منتج{% endblock %}
{% block body %}
<div class="nav"><strong>NQ Supermarket ERP</strong><a href="{{ url_for('products.index') }}">المنتجات</a></div>
<div class="container" style="max-width:800px"><div class="card"><h1>إضافة منتج</h1>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>SKU</label><input class="input" name="sku" required>
<label>الاسم بالعربية</label><input class="input" name="name_ar" required>
<label>الاسم بالإنجليزية</label><input class="input" name="name_en">
<label>Barcode</label><input class="input" name="barcode">
<label>التصنيف</label><select class="input" name="category_id" required><option value="">اختر</option>{% for c in categories %}<option value="{{ c.id }}">{{ c.name_ar }}</option>{% endfor %}</select>
<label>العلامة التجارية</label><select class="input" name="brand_id"><option value="">بدون</option>{% for b in brands %}<option value="{{ b.id }}">{{ b.name_ar }}</option>{% endfor %}</select>
<label>الوحدة</label><select class="input" name="unit_id" required><option value="">اختر</option>{% for u in units %}<option value="{{ u.id }}">{{ u.name_ar }} ({{ u.code }})</option>{% endfor %}</select>
<div class="grid"><div><label>سعر الشراء</label><input class="input" type="number" step="0.001" min="0" name="purchase_price" value="0"></div><div><label>سعر البيع</label><input class="input" type="number" step="0.001" min="0" name="selling_price" value="0" required></div><div><label>الحد الأدنى للمخزون</label><input class="input" type="number" step="0.001" min="0" name="min_stock" value="0"></div></div>
<label><input type="checkbox" name="track_batch"> تتبع Batch</label><br><label><input type="checkbox" name="track_expiry"> تتبع الصلاحية</label><br><button class="btn" type="submit">حفظ المنتج</button>
</form></div></div>
{% endblock %}
